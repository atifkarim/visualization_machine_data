services:
  explorer:
    build: .
    ports:
      - "127.0.0.1:5012:5012"
    volumes:
      - explorer-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5012/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  explorer-data:
